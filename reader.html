<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Docket</title>
  <script src="platform.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="reader">
  <div class="progress" id="progress"></div>
  <header class="rbar" id="rbar">
    <a class="back" href="library.html" id="back"></a>
    <span class="mid" id="mid"></span>
    <div class="rt">
      <button id="info" aria-label="Details"></button>
      <button id="aa" class="aa" aria-label="Text options">Aa</button>
    </div>
  </header>
  <article class="paper" id="paper"></article>
  <div class="dock" id="dock" hidden></div>
  <script type="module" src="reader.js"></script>
</body>
</html>
